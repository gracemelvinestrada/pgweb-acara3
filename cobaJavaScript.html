<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
</head>

<body>

    Nama: <i id="value_nama"></i>
    <br>
    Umur: <i id="value_umur"></i> tahun

    <script>
        var nama = "Grace Melvin Estrada";

        /* Variable Number*/
        let umur = 19;

        let tinggi = 155;

        //array
        let film_favorit = ["Knives Out", "Sore"];

        //menampilkan value ke console
        console.log("Nama: " + nama);
        console.log("Umur: " + umur);
        console.log("Tinggi: " + tinggi + " cm");
        console.log("Film Favorit: " + film_favorit[0]);

        // operasi matematis - Arithmetic Operation
        let a = 18;
        let b = 11.5;

        let jumlah = a + b;
        console.log("Hasil Penjumlahan a & b: " + jumlah);

        let kurang = a - b;
        console.log("Hasil Pengurangan a & b: " + kurang)

        let kali = a * b;
        console.log("Hasil perkalian a & b: " + kali)

        let bagi = a / b;
        console.log("Hasil pembagian a & b: " + bagi)

        let pangkat = a ** 2;
        console.log("Hasil kuadrat a: " + pangkat)

        //if condition
        let nilai = 60
        if (nilai >= 90) {
            console.log("Nilai: A");
        } else if (nilai >= 80 < 90) {
            console.log("Nilai: B");
        } else if (nilai >= 70 < 80) {
            console.log("Nilai: C");
        } else {
            console.log("Nilai: D");
        }

        //looping
        for (let i = 1; i <= 10; i++) {
            console.log(i);
        }

        // function
        function penjumlahan(a, b) {
            return console.log("Hasil penjumlahan: " + (a + b));
        }
        // memanggil function
        penjumlahan(10, 80)

        // menampilkan nama ke halaman (DOM)
        document.getElementById("value_nama").innerHTML = nama;
        document.getElementById("value_umur").innerHTML = umur;

    </script>

</body>

</html>
